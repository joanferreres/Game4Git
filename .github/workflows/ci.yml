# GitHub Actions: lint, build, security. Production deploy is Cloudflare Workers
# (wrangler / Workers Builds) — not GitHub Actions. See deploy/README.md.

name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-audit # Audit will be done in a separate, dedicated step

    - name: Run linter
      run: npm run lint

    - name: Build project
      run: npm run build

  security-scans:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-audit

    - name: Run npm audit for critical vulnerabilities
      run: npm audit --omit=dev --audit-level=critical
