    <!-- Critical CSS: Prevent FOUC and enable first paint without external CSS -->
    <style>
      :root{--background:0 0% 100%;--foreground:240 10% 3.9%;--card:0 0% 100%;--card-foreground:240 10% 3.9%;--primary:14 86% 57%;--primary-foreground:210 40% 98%;--secondary:240 4.8% 95.9%;--muted:240 4.8% 95.9%;--muted-foreground:240 3.8% 44%;--accent:240 4.8% 95.9%;--border:240 5.9% 90%;--radius:0.5rem;--ring:14 86% 57%}
      .dark{--background:240 10% 3.9%;--foreground:0 0% 98%;--card:240 10% 3.9%;--card-foreground:0 0% 98%;--primary:14 86% 62%;--muted:240 3.7% 15.9%;--muted-foreground:240 5% 64.9%;--border:240 3.7% 15.9%}
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .min-h-screen{min-height:100vh}
      .flex{display:flex}
      .flex-col{flex-direction:column}
      .items-center{align-items:center}
      .justify-center{justify-content:center}
      .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
      @keyframes pulse{50%{opacity:.5}}
      .text-muted-foreground{color:hsl(var(--muted-foreground))}
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      @media(min-width:640px){.container{padding-left:1.5rem;padding-right:1.5rem}}
      @media(min-width:1024px){.container{padding-left:2rem;padding-right:2rem}}
      .max-w-6xl{max-width:72rem}.max-w-3xl{max-width:48rem}
      .mx-auto{margin-left:auto;margin-right:auto}.mt-6{margin-top:1.5rem}.mt-8{margin-top:2rem}
      .grid{display:grid}.gap-4{gap:1rem}
      @media(min-width:768px){.md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(min-width:1280px){.xl\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
      .min-h-\[340px\]{min-height:340px}
    </style>

    <script type="text/javascript">
      (function () {
        var isLocalHost =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";

        if (isLocalHost) {
          return;
        }

        var loadClarity = function () {
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

        // Load analytics only after the page has fully loaded AND the main thread is

        var scheduleClarity = function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadClarity, { timeout: 10000 });
          } else {
            setTimeout(loadClarity, 3000);
          }
